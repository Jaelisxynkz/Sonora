<!doctype html>
<html lang="en">
<head>

<title>Sonora</title>
<style>
  html,body{height:100%;margin:0}

  p{color:#aaa6c2;margin:0 0 28px;font-size:14px}
  button{background:#8b5cf6;color:#fff;border:0;border-radius:999px;padding:12px 28px;font-weight:600;font-size:14px;cursor:pointer}

  <div>
    <h1>SONORA</h1>
    <p>You're offline. Connect to the internet to keep listening.</p>
